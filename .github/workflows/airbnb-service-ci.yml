name: coastal-price-api

on:
  pull_request:
    paths:
      - "ML/Airbnb_Price_Prediction/**"
      - ".github/workflows/airbnb-service-ci.yml"
  push:
    branches: [main]
    paths:
      - "ML/Airbnb_Price_Prediction/**"
      - ".github/workflows/airbnb-service-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API and model dependencies
        run: python -m pip install -r ML/Airbnb_Price_Prediction/service/requirements.txt
      - name: Offline train/predict integration tests
        run: python -m unittest discover -s ML/Airbnb_Price_Prediction/service/tests -v
      - name: Python syntax checks
        run: python -m compileall -q ML/Airbnb_Price_Prediction/service
